<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion de Présence</title>

<link rel="stylesheet"
href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<!-- CSS -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Gestion de Présence</h1>

<input type="file" id="file" accept=".xlsx,.xls">
<h2 id="classe"></h2>

<button onclick="alert('Présents : '+document.querySelectorAll('#eleves .present').length+'\nAbsents : '+document.querySelectorAll('#eleves .absent').length)">
Afficher le nombre de présents et absents
</button>

<table>
<thead>
<tr><th>Nom/Prenom</th><th>Code-Barres</th><th>Présence</th></tr>
</thead>
<tbody id="eleves"></tbody>
</table>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.16.2/xlsx.full.min.js"></script>

<script>
file.onchange=e=>{
 const r=new FileReader();
 r.onload=e=>{
  const rows=XLSX.utils.sheet_to_json(
   XLSX.read(e.target.result,{type:"array"}).Sheets[
    XLSX.read(e.target.result,{type:"array"}).SheetNames[0]
   ],{header:1});

  eleves.innerHTML="";
  rows.forEach(x=>{
   if(!x[0])return;
   let t=String(x[0]).trim();

   if(t.toLowerCase().startsWith("classe"))
    return classe.textContent=t;

   if(t.toLowerCase().startsWith("groupe")||x[1]==undefined)return;

   eleves.innerHTML+=`
    <tr class="absent">
     <td>${x[0]}</td>
     <td>${x[1]}</td>
     <td><input type="checkbox" onchange="
      this.parentElement.parentElement.className=
      this.checked?'present':'absent'
     "></td>
    </tr>`;
  });
 };
 r.readAsArrayBuffer(e.target.files[0]);
};
</script>

</body>
</html>
